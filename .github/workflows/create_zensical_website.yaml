# Adapted from https://zensical.org/docs/publish-your-site/#with-github-actions
name: Create Zensical website


on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/create_zensical_website.yaml
      - 'docs/**'
      - zensical.toml
      - pron.pde

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  create_zensical_website:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Add the game to the website
        run: |
          cp pron.pde docs/game/
          curl --fail --silent --show-error --location \
            --output docs/game/processing.min.js \
            https://cdnjs.cloudflare.com/ajax/libs/processing.js/1.6.6/processing.min.js
          cat > docs/game/pron.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Pron</title>
            <script src="processing.min.js"></script>
            <style>html, body { margin: 0; padding: 0; background: black; overflow: hidden; }</style>
          </head>
          <body>
            <canvas data-processing-sources="pron.pde" tabindex="0"></canvas>
          </body>
          </html>
          EOF
      - run: pip install zensical
      - run: zensical build --clean --strict
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
